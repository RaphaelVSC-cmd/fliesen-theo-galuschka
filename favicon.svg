<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tileGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C85A32"/>
      <stop offset="100%" stop-color="#9E401D"/>
    </linearGradient>
    <linearGradient id="tileGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3740"/>
      <stop offset="100%" stop-color="#161A1D"/>
    </linearGradient>
    <linearGradient id="accentGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F6F2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F7F6F2" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  
  <!-- Outer rounded shield base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#161A1D" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- 4-quadrant geometric tile arrangement with 2.5px precision joint gap -->
  <!-- Top Left: Master Terracotta Tile -->
  <rect x="12" y="12" width="18" height="18" rx="3.5" fill="url(#tileGrad1)"/>
  
  <!-- Top Right: Graphite Slate Tile -->
  <rect x="34" y="12" width="18" height="18" rx="3.5" fill="url(#tileGrad2)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  
  <!-- Bottom Left: Graphite Slate Tile -->
  <rect x="12" y="34" width="18" height="18" rx="3.5" fill="url(#tileGrad2)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  
  <!-- Bottom Right: Accent Terracotta Tile -->
  <rect x="34" y="34" width="18" height="18" rx="3.5" fill="url(#tileGrad1)"/>
  
  <!-- Center Precision Cross / Joint Anchor -->
  <circle cx="32" cy="32" r="3.2" fill="#F7F6F2"/>
  <circle cx="32" cy="32" r="1.4" fill="#B85028"/>
  
  <!-- Corner gleam accent -->
  <path d="M14 14 L24 14 A 2 2 0 0 1 26 16 L14 26 Z" fill="url(#accentGleam)" opacity="0.35"/>
</svg>
